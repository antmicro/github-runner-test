on: [push]

name: test

jobs:
  no-secrets:
    container: debian:trixie
    runs-on: [self-hosted, Linux, X64]
     
    steps:
    - run: |
        apt-get -qqy --update install git nodejs npm
        pushd /tmp
        git clone https://github.com/actions/checkout
        cd checkout
        npm ci
        npm run build
        node dist/index.js
        popd
        ls
