on: [push]

name: test

jobs:
  no-secrets:
    container: almalinux:10
    runs-on: [self-hosted, Linux, X64]
     
    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - run: pwd

  secret-bad:
    container: debian:bullseye
    runs-on: [self-hosted, Linux, X64]
    env:
      GHA_PREEMPTIBLE: "false"
    steps:
    - run: _secret_ipv6-test || echo test

  secret-ok:
    container: debian:bullseye
    runs-on: [self-hosted, Linux, X64]
    env:
      GHA_PREEMPTIBLE: "false"
    steps:
    - run: _secret_ipv6-test
