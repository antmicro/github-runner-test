on: [push]

name: test

jobs:
  no-secrets:
    container: debian:trixie
    runs-on: [self-hosted, Linux, X64]
     
    steps:
    - run: apt-get -qqy --update install git nodejs npm >/dev/null 2>&1
    - name: test
      env:
        INPUT_TOKEN: ${{ github.token }}
      run: |
        pushd /tmp
        git clone https://github.com/actions/checkout
        cd checkout
        npm ci
        npm run build
        ls dist
        node dist/index.js
        popd
        ls
