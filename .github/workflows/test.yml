on: [push]

name: test

jobs:
  simple-job:
    container: debian:bullseye
    runs-on: [self-hosted, Linux, X64]
    env:
      GHA_PREEMPTIBLE: "false"
    steps:
    - uses: actions/checkout@v2
      with:
          submodules: recursive
    - run: ls -alh
    - run: apt -qqy update && apt -qqy install iputils-ping iproute2
    - run: hostname
    - run: printenv
    - run: ip a
