on: [push]

name: test

jobs:
  version:
    permissions:
      contents: read
      id-token: write
    container: debian:trixie
    runs-on: [self-hosted, Linux, X64]
    # runs-on: [ubuntu-latest]
    steps:
      - run: echo test > /usr/local/share/test
      - uses: actions/cache@v3
        with:
          repository: bazelbuild/examples
          path: /usr/local/share/test
          key: ${{ runner.os }}-test
          
      - name: Bazel setup
        uses: bazel-contrib/setup-bazel@0.19.2
        with:
          bazelisk-version: v1.30.0
          bazelisk-cache: false
          cache-save: false
          external-cache: false
          repository-cache: false
      - run: cat $GITHUB_PATH
      - run: cat $GITHUB_ENV
      - run: echo $PATH
